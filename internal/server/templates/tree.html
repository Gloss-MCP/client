{{define "treeChildren"}}
{{$prefix := .LinkPrefix}}{{$target := .HXTarget}}
<ul class="pl-2">
{{range .Node.Children}}
  {{if .IsDir}}
  <li x-data="{open: true}">
    <button type="button" class="font-medium" @click="open = !open">{{.Name}}/</button>
    <div x-show="open">{{template "treeChildren" (treeCtx . $prefix $target)}}</div>
  </li>
  {{else}}
  <li>
    <a href="{{$prefix}}/files/{{.Path}}" hx-get="{{$prefix}}/files/{{.Path}}" hx-target="{{$target}}" hx-push-url="true" class="block hover:underline">{{.Name}}</a>
  </li>
  {{end}}
{{end}}
</ul>
{{end}}

{{define "themePicker"}}
<div class="mt-4 pt-3 border-t border-gray-200 flex items-center gap-2 text-xs text-gray-500" role="group" aria-label="Colour theme">
  <span>Theme</span>
  <button type="button" data-theme-choice="light" aria-pressed="false" class="hover:underline aria-pressed:font-semibold aria-pressed:text-gray-900">Light</button>
  <button type="button" data-theme-choice="dark" aria-pressed="false" class="hover:underline aria-pressed:font-semibold aria-pressed:text-gray-900">Dark</button>
  <button type="button" data-theme-choice="system" aria-pressed="false" class="hover:underline aria-pressed:font-semibold aria-pressed:text-gray-900">System</button>
</div>
{{end}}
