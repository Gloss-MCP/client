name: Release

# Pushing a v* tag runs the full CI gate, then builds a DRAFT GitHub
# release. Review its assets and publish it by hand; publishing triggers the
# Homebrew tap update (skipped for pre-releases like v0.1.0-rc1).
# See docs/releasing.md.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  gate:
    name: CI gate
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  release:
    name: Draft release
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser needs the full history and tags.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Release notes
        run: make release-notes VERSION_TAG="${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/notes.md"
      - name: Build and draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release NOTES="${RUNNER_TEMP}/notes.md"

  tap:
    name: Update Homebrew tap
    # Only for published, non-pre-release releases. A pre-release never
    # reaches brew users.
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check tap token
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set; see docs/releasing.md"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Fetch published checksums
        run: |
          curl -fsSL -o "${RUNNER_TEMP}/checksums.txt" \
            "https://github.com/${{ github.repository }}/releases/download/${TAG}/checksums.txt"
      - uses: actions/checkout@v4
        with:
          repository: gloss-mcp/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Render formula
        run: |
          mkdir -p tap/Formula
          make release-formula VERSION_TAG="${TAG}" SUMS="${RUNNER_TEMP}/checksums.txt" > tap/Formula/gloss.rb
      - name: Push formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/gloss.rb
          git diff --cached --quiet && { echo "formula unchanged"; exit 0; }
          git commit -m "gloss ${TAG}"
          git push
