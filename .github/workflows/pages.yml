name: Pages

on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "Makefile"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - name: Test site
        run: go test ./site/...
      - name: Build CSS
        run: make site
      - uses: actions/configure-pages@v5
      - name: Stage site
        run: |
          mkdir _site
          cp site/*.html _site/
          cp site/install.sh _site/
          mkdir _site/css
          cp site/css/site.css _site/css/
          cp -r site/js _site/js
          if [ -d site/img ]; then cp -r site/img _site/img; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
